<rect x="827" y="604" width="30.0" height="19" fill="#2A9D8F" rx="2"/>
<text x="864.0" y="618" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17212B">19.6 d</text>
<line x1="55" y1="665" x2="1145" y2="665" stroke="#DCE3E8"/>
<text x="55" y="696" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#E76F51">Decision: standard whole-sample alignment is operationally slow; design parallel chunk alignment with one global sample-level deduplication.</text>
<text x="55" y="724" font-family="Arial,sans-serif" font-size="12" fill="#5D6B78">Projection assumes linear scaling from compressed input size and excludes queue delay, storage contention, retries, and chunk overhead.</text>
<text x="55" y="746" font-family="Arial,sans-serif" font-size="12" fill="#5D6B78">Cost model: projected CPU-hours × local CPU-hour rate + retained TB-months × storage rate + any scheduler or egress charges.</text>
<text x="1145" y="760" text-anchor="end" font-family="Arial,sans-serif" font-size="11" fill="#5D6B78">Source: benchmarks/pilot-summary.tsv and pilot-task-metrics.tsv</text>
</svg>
