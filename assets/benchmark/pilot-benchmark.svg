<text x="255.0" y="542" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17212B">17.3 s</text>
<text x="480.0" y="609" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#5D6B78">Real execution time (minutes)</text>
<text x="775" y="125" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#17212B">Evidence and production projection</text>
<text x="775" y="173" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">Measured</text>
<text x="775" y="203" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16324F">2h 03m 44s</text>
<text x="955" y="203" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">pilot wall time</text>
<text x="775" y="239" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16324F">38.9 GB</text>
<text x="920" y="239" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">alignment peak RSS</text>
<text x="775" y="275" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#16324F">97%</text>
<text x="853" y="275" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">12-CPU alignment utilization</text>
<line x1="775" y1="301" x2="1145" y2="301" stroke="#DCE3E8"/>
<text x="775" y="333" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">Projected from 76.0× compressed-byte scaling</text>
<text x="775" y="365" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#E76F51">6.5 days</text>
<text x="910" y="365" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">per full sample</text>
<text x="775" y="401" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#E76F51">56,069</text>
<text x="900" y="401" font-family="Arial,sans-serif" font-size="13" fill="#5D6B78">CPU-hours for 30 samples</text>
<text x="775" y="451" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17212B">30-sample elapsed time by concurrency</text>
<text x="815" y="491" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#17212B">1 at once</text>
<rect x="827" y="478" width="300.0" height="19" fill="#2A9D8F" rx="2"/>
<text x="1134.0" y="492" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17212B">195.8 d</text>
<text x="815" y="533" text-anchor="end" font-family="Arial,sans-serif" font-size="12" fill="#17212B">3 at once</text>
<rect x="827" y="520" width="100.1" height="19" fill="#2A9D8F" rx="2"/>
<text x="934.1" y="534" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17212B">65.3 d</text>
