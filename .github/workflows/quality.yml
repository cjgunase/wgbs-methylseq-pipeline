name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate shell and Slurm script syntax
        shell: bash
        run: |
          set -euo pipefail
          for script in bin/*; do
            bash -n "$script"
          done

      - name: Check whitespace errors
        run: git show --check --oneline --format= HEAD

      - name: Confirm executable script permissions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            test -x "$script" || {
              echo "Script is not executable: $script" >&2
              exit 1
            }
          done < <(find bin -maxdepth 1 -type f -print)
